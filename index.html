<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONOCHROME</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="halo"></div>

  <canvas id="canvas"></canvas>

  <main>
    <div class="content">

      <span class="tag">COMING</span>

      <div class="ring-container">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5" />
          <circle class="ring-arc" cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" stroke-dasharray="140 425" stroke-linecap="round" transform="rotate(-90 100 100)" />
        </svg>
        <div class="countdown">
          <div class="block">
            <span class="num" id="cd-days">00</span>
          </div>
          <span class="sep">:</span>
          <div class="block">
            <span class="num" id="cd-hours">00</span>
          </div>
          <span class="sep">:</span>
          <div class="block">
            <span class="num" id="cd-mins">00</span>
          </div>
          <span class="sep">:</span>
          <div class="block">
            <span class="num" id="cd-secs">00</span>
          </div>
        </div>
        <div class="labels">
          <span>Jours</span>
          <span>Heures</span>
          <span>Minutes</span>
          <span>Secondes</span>
        </div>
      </div>

      <div class="line"></div>

      <span class="date">11.06.2026 — 20h00</span>

    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
